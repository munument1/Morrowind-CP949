name: Create or update RC6 Classic CP949 pre-release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/create-rc6-prerelease.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create or update RC6 pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG='v1.0.7-rc6-classic-cp949-pre1'
          REPO="$GITHUB_REPOSITORY"
          cat > /tmp/release-notes.md <<'EOF'
          RC6 `MRK WINDOWS SAFE` 기반 Classic Morrowind CP949 시험판입니다.

          ## 중요: 번역 ZIP만으로는 한글 폰트가 설치되지 않습니다

          이 Release의 MO2 ZIP은 **ESP / MRK / README만** 포함합니다. CP949 대응 `Morrowind.exe`는 바이트 해석을 담당하고, 실제 한글 글리프는 별도의 FNT/TEX bitmap font가 제공합니다.

          신규/깨끗한 설치에서는 다음 세 요소가 모두 필요합니다.
          1. `tools/patch_morrowind_cp949.py`로 패치한 실행 파일
          2. `tools/build_classic_cp949_fonts.py`로 생성한 Classic CP949 bitmap font
          3. 이 Release의 RC6 번역 MO2 ZIP

          폰트 빌더는 폰트 바이너리를 포함하지 않습니다. 사용자가 가진 원본 Morrowind `Data Files/Fonts`와 사용자가 별도로 준비한 한국어 TTF를 입력으로 사용합니다. 자세한 절차는 저장소의 `CLASSIC_FONT_SETUP.md`를 참고하세요.

          ## RC6 소스 상태

          OpenMW RC6 소스는 독립 정적 검증을 통과했습니다. MRK는 373행이며 `0x1A 0`, 중복 topic 0, 중복 keyword 0, stale keyword 0입니다. MRK에 안전하게 넣을 수 없었던 13개 토픽은 MRK에서 제외하고 검수된 INFO 응답 26개 안에 실제 DIAL명을 직접 넣는 방식으로 복구했습니다.

          OpenMW 실게임 확인 표본:
          - 금화 되찾기 링크
          - 파르고스의 은닉처 링크 및 후속 선택지
          - 그가 화내는 -> 그가 화내는 걸 봤다 링크

          Classic CP949 RC6 통합판은 정적 검증 PASS이며 전체 런타임 회귀 테스트는 아직 진행 중입니다.

          ## Classic 빌드 내용
          - compiled SCPT 236개
          - MessageBox 본문 413개 / 버튼 359개
          - AddTopic 105개
          - scripted Say 128개
          - Windows-safe MRK 373행
          - FNAM 32바이트 초과 33건 Classic 호환 처리
          - Voice INFO `ANAM="Wilderness"` 문제 조건 제거
          - 프로케수스 INFO 1개 및 `ANAM = Seyda Neen, Census and Excise Office` 유지

          ## SHA-256
          - RC6 source ZIP: `9bfe99f9e296c692ba15cee9540cc9de193d49dad6b5421a31a642da62c237f4`
          - RC6 source ESP: `26da6c578d7136eb0e12f63d4e2d326cef2c10d7e4a148684c65136f753052e2`
          - RC6 source MRK: `030bb6acb37f1d5718d0af7c4c49367f596dc95e7f75805113a5707bb69b675f`
          - Classic ESP: `d876e2fd60b84380a3bca4750033ac6a36f776e173f5f2476433c66e519a9762`
          - Classic MRK: `27bf3f214da101518829ec450a476f4d81e60553f2e778a16888e42713fcd0b2`
          - MO2 ZIP: `f744692d151a65ff1718cbfaf858063aa7e4daaae2beefd05613b6af1b24eca2`

          ## 우선 회귀 테스트
          - 기존 한글 폰트 모드를 비활성화한 clean-font 환경
          - 새 폰트 빌더 출력만으로 한글 렌더링
          - 게임 시작 시 스크립트 재컴파일 경고 여부
          - 지웁/시작부 경비병 Say 자막
          - 시작부 MessageBox 및 버튼
          - 세이다 닌의 파르고스/흐리스카르/프로케수스 관련 토픽
          EOF

          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$REPO" --title 'Morrowind Classic CP949 v1.0.7-rc6 Pre-release' --notes-file /tmp/release-notes.md --prerelease
          else
            gh release create "$TAG" --repo "$REPO" --target main --title 'Morrowind Classic CP949 v1.0.7-rc6 Pre-release' --notes-file /tmp/release-notes.md --prerelease
          fi
